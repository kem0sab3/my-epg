name: crest-test
on: push
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out
          python3 - <<'PY'
          import re, urllib.request, urllib.parse, os
          UA={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36"}
          def get(u):
              return urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=30).read()
          seen=set(); n=0
          for page in ("https://www.perthstjohnstonefc.co.uk/", "https://www.perthstjohnstonefc.co.uk/news/article/the-launch-of-a-refreshed-brand-identity"):
              try: html=get(page).decode("utf-8","ignore")
              except Exception as e: print("PAGE ERR", page, e); continue
              urls=re.findall(r'''(?:src|href|content|data-src|srcset)=["']([^"' ]+\.(?:svg|png|webp|jpg)[^"' ]*)''', html, re.I)
              for u in urls:
                  u=urllib.parse.urljoin(page, u.replace("&amp;","&"))
                  if u in seen: continue
                  seen.add(u)
                  print("IMG", u)
                  if re.search(r"crest|logo|badge|brand|favicon|icon", u, re.I) and n < 15:
                      try:
                          d=get(u); n+=1
                          ext=u.split("?")[0].rsplit(".",1)[-1][:4]
                          open(f"out/{n:02d}.{ext}","wb").write(d); print("   SAVED", n, len(d))
                      except Exception as e: print("   ERR", e)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: crests
          path: out
