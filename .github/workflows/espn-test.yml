name: espn-test
on: push
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://site.api.espn.com/apis/site/v2/sports/soccer
          for q in "sco.1/scoreboard" "sco.1/scoreboard?dates=20261107" "sco.1/scoreboard?dates=20261106-20261212" "sco.1/scoreboard?dates=20261106-20261212&limit=500" "sco.1/scoreboard?dates=20261106-20261212&limit=100" "sco.1/scoreboard?dates=20261106-20261120" "sco.1/scoreboard?dates=20261107-20261114&limit=200" "sco.tennents/scoreboard?dates=20261106-20261212" "sco.cis/scoreboard" "sco.challenge/scoreboard" "uefa.europa/scoreboard?dates=20261106-20261212" "sco.1/teams"; do
            code=$(curl -s -A Mozilla/5.0 -H 'Accept: application/json' -o out.json -w '%{http_code}' "$B/$q")
            echo "$code $q events=$(python3 -c "import json;d=json.load(open('out.json'));print(len(d.get('events',[])), d.get('leagues',[{}])[0].get('name'))" 2>/dev/null) $(head -c 150 out.json)"
          done
          curl -s -A Mozilla/5.0 "$B/sco.1/scoreboard?dates=20261107-20261114" | python3 -c "
          import json,sys;d=json.load(sys.stdin)
          for e in d.get('events',[])[:8]:
              c=e['competitions'][0]
              print(e['date'],e['name'],[x['team'].get('displayName')+'/'+x['team'].get('shortDisplayName','')+'/'+x['team'].get('location','') for x in c['competitors']],c.get('broadcasts'),c.get('geoBroadcasts'),c.get('venue',{}).get('fullName'))
          "
          curl -s -o s.json -w 'sky %{http_code}\n' https://awk.epgsky.com/hawk/linear/services/4101/1; python3 -c "
          import json;d=json.load(open('s.json'));print([ (s['sid'],s['t']) for s in d.get('services',[]) if any(k in s['t'].lower() for k in ('sky sp','premier','tnt','bbc scot','alba'))][:60])"
