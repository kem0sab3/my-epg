name: espn-test
on: push
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request, re
          def get(u):
              try: return json.load(urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent":"Mozilla/5.0"}), timeout=30))
              except Exception as e: return {"err": str(e)}
          B="https://site.api.espn.com/apis/site/v2/sports/soccer"
          for lg in ("uefa.nations","fifa.friendly","fifa.worldq.uefa","uefa.euroq"):
              d=get(f"{B}/{lg}/teams")
              ts=[t["team"] for t in (d.get("sports") or [{}])[0].get("leagues",[{}])[0].get("teams",[])] if "sports" in d else []
              print("NT", lg, d.get("err"), len(ts), [(t["id"],t["displayName"]) for t in ts if "Scot" in t["displayName"]])
          s=get("https://awk.epgsky.com/hawk/linear/services/4101/1")
          sv=s.get("services",[])
          print("SKYALL", [(x["sid"],x["t"]) for x in sv if re.search(r"sk.*sp|sport|premier|bbc|stv|alba", x["t"], re.I)])
          for sid,name in [(x["sid"],x["t"]) for x in sv if re.search(r"sk.*sp|premier|tnt", x["t"], re.I)]:
              for date in ("20261108","20261107"):
                  j=get(f"https://awk.epgsky.com/hawk/linear/schedule/{date}/{sid}")
                  for ev in (j.get("schedule") or [{}])[0].get("events") or []:
                      if re.search(r"celtic|rangers|hearts|hibernian|aberdeen|kilmarnock|scottish|spfl|motherwell|dundee|st mirren|falkirk|johnstone", ev.get("t","")+" "+ev.get("sy",""), re.I):
                          print("EV", name, sid, date, ev.get("st"), ev.get("d"), ev.get("t"), "|", ev.get("sy","")[:160])
          PY
