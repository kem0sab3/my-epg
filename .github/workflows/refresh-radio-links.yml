name: Refresh radio links

on:
  schedule:
    - cron: "41 */2 * * *"    # every 2 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Refresh the Bauer radio links
        run: python3 refresh_links.py
      - name: Check a few stations play
        run: |
          for name in "Clyde 1" "Forth 1" "KISS" "Planet Rock"; do
            url=$(grep -A1 -m1 ",$name\$" playlist.m3u | tail -n1)
            code=$(curl -s -o /dev/null -r 0-2000 --max-time 8 -w '%{http_code}' "$url" || true)
            echo "$name: $code"
          done
      - name: Save
        run: |
          git config user.name "epg-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Refresh radio links"
          git pull --rebase -X theirs
          git push
