name: Refresh radio links

on:
  schedule:
    - cron: "41 */2 * * *"    # every 2 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Refresh the Bauer radio links
        run: python3 refresh_links.py
      - name: Save
        run: |
          git config user.name "epg-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Refresh radio links"
          git pull --rebase -X theirs
          git push
