name: Update EPG

on:
  schedule:
    - cron: "17 3 * * *"     # every day at 03:17 UK time (winter) / 04:17 (summer)
  workflow_dispatch:          # adds a "Run workflow" button so you can update it any time
  push:
    branches: [main]
    paths:                    # also rebuild straight away when you change your lists
      - sources.txt
      - channels.txt
      - settings.txt
      - playlist_source.m3u
      - static_guide.txt
      - football.txt

concurrency:
  group: epg
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build EPG
        run: python build_epg.py
      - name: Save the new EPG
        run: |
          git config user.name "epg-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add epg.xml.gz playlist.m3u logos
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update EPG $(date -u +'%Y-%m-%d')"
          git pull --rebase -X theirs
          git push
