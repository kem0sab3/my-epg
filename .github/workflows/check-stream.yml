name: Check stream (temporary)
on:
  push:
    paths:
      - .github/workflows/check-stream.yml
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for s in bbc_radio_one bbc_radio_shetland bbc_radio_orkney; do
            echo "== $s"
            curl -s "https://lsn.lv/bbcradio.m3u8?station=$s&bitrate=320000" | head -c 600 | sed 's/^/BODY /'
            echo
          done
