name: Check stream (temporary)
on:
  push:
    paths:
      - .github/workflows/check-stream.yml
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in \
            "https://lsn.lv/bbcradio.m3u8?station=bbc_radio_one&bitrate=320000" \
            "https://lsn.lv/bbcradio.m3u8?station=bbc_radio_shetland&bitrate=320000" \
            "https://lsn.lv/bbcradio.m3u8?station=bbc_radio_shetland%22&bitrate=320000%22"; do
            echo "== $u"
            curl -s -o /dev/null -L --max-redirs 5 -w 'final=%{url_effective} code=%{http_code}\n' "$u" || true
            curl -sI "$u" | grep -iE '^(HTTP|location)' || true
          done
          echo "== direct guesses"
          for scope in uk ww; do
            u="https://as-hls-$scope-live.akamaized.net/pool_01505109/live/$scope/bbc_radio_one/bbc_radio_one.isml/bbc_radio_one-audio%3d320000.norewind.m3u8"
            echo "radio1 $scope $(curl -s -o /dev/null -w '%{http_code}' "$u")"
          done
